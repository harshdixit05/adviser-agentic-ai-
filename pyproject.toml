[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "intellimindz-advisor"
version = "0.1.0"
description = "AI Learning Advisor for Intellimindz Foundation"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg2-binary",
  "alembic",
  "openpyxl",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "python-dotenv",
  "langgraph>=1.0",
  "langchain-core>=1.0",
  "langchain-google-genai>=4.0",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
]

# Without this, setuptools sees `data/` beside `app/` and refuses to guess
# which top-level directories are packages, so `pip install -e .` fails.
[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
