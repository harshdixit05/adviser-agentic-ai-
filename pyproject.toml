[project]
name = "intellimindz-advisor"
version = "0.1.0"
description = "AI Learning Advisor for Intellimindz Foundation"
requires-python = ">=3.11"
dependencies = [
  "sqlalchemy>=2.0",
  "psycopg2-binary",
  "alembic",
  "openpyxl",
  "pydantic",
  "pydantic-settings",
  "pyyaml",
  "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
